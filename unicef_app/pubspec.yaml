name: unicef_app
description: "ComMobi-Tracker - Offline-First Mobile App for MINPROFF/UNICEF Cameroon"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.0
  flutter_tts: ^4.0.2
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.19.0
  flutter_screenutil: ^5.9.3
  flutter_animate: ^4.5.2
  image_picker: ^1.1.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^13.0.2
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/unicef_logo.png
    - assets/images/minproff_logo.png
    - assets/images/pp1.jpeg
    - assets/images/pp2.JPG
