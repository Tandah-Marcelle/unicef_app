services:
  db:
    image: postgres:16-alpine
    container_name: commobi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: unicef_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - commobi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unicef_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: commobi_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@db:5432/unicef_db
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"
    command: sh -c "npm run db:setup && npm start"

volumes:
  commobi_pgdata: